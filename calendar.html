<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kindle E-ink Kalendář</title>
    <style>
        /* Poznámka: staré WebKit v Kindle prohlížeči nepodporuje CSS proměnné,
           flexbox, grid ani vh/vw jednotky. Layout je proto postaven na
           float / display:table-cell a barvy jsou napsané natvrdo jako hex. */

        * {
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            /* Ideální šířka a orientace pro Kindle (600x800) */
            width: 100%;
            max-width: 590px;
            margin: 0 auto;
            padding: 15px;
        }

        /* --- HORNÍ SEKCE --- */
        .top-section {
            width: 100%;
            height: 210px;
            margin-bottom: 15px;
        }

        .top-section:after {
            content: "";
            display: table;
            clear: both;
        }

        /* Levý panel: Hodiny (2/3) */
        .clock-panel {
            float: left;
            width: 320px;
            height: 210px;
            margin-right: 15px;
            background-color: #000000;
            color: #ffffff;
            -webkit-border-radius: 6px;
            border-radius: 6px;
            padding: 20px;
            cursor: pointer; /* Změna kurzoru pro indikaci klikatelnosti */
        }

        .clock-date {
            color: #cccccc;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .clock-time-wrapper {
            margin-top: 15px;
        }

        .clock-time {
            font-size: 5em;
            font-weight: 800;
            line-height: 1;
        }

        .clock-am-pm {
            margin-top: 10px;
            height: 30px;
        }

        .clock-am-pm:after {
            content: "";
            display: table;
            clear: both;
        }

        .clock-24h-badge {
            float: left;
            background-color: #666666;
            color: #e8e8e8;
            font-size: 12px;
            padding: 2px 6px;
            -webkit-border-radius: 4px;
            border-radius: 4px;
        }

        .clock-ampm-text {
            float: right;
            font-size: 24px;
            font-weight: bold;
        }

        /* Pravý panel: Odjezdy MHD (1/3). Řádek = table, aby štítek linky
           a text měly stejnou výšku (flex a grid starý WebKit nezná). */
        .departures-panel {
            float: left;
            width: 225px;
            height: 210px;
            background-color: #f4f4f4;
            border: 2px solid #cccccc;
            -webkit-border-radius: 6px;
            border-radius: 6px;
            padding: 10px;
            overflow: hidden;
        }

        .dep-row {
            display: table;
            width: 100%;
            margin-bottom: 6px;
        }

        .dep-line {
            display: table-cell;
            vertical-align: middle;
            width: 40px;
            padding: 4px 0;
            background-color: #000000;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            -webkit-border-radius: 3px;
            border-radius: 3px;
        }

        .dep-info {
            display: table-cell;
            vertical-align: middle;
            padding-left: 8px;
        }

        .dep-towards {
            font-size: 12px;
            color: #333333;
            white-space: nowrap;
            overflow: hidden;
        }

        .dep-times {
            font-size: 16px;
            font-weight: bold;
        }

        .dep-empty {
            padding-top: 30px;
            font-size: 12px;
            color: #555555;
            text-align: center;
        }

        /* --- SPODNÍ SEKCE: Události --- */
        .day-block {
            border: 2px solid #cccccc;
            -webkit-border-radius: 6px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .day-block:last-child {
            margin-bottom: 0;
        }

        .day-header {
            background-color: #666666;
            color: #ffffff;
            font-weight: bold;
            padding: 8px 12px;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Řádek události: table/table-cell místo flexu, aby indikátor
           a text byly stejně vysoké (float toho spolehlivě nedosáhne) */
        .event-item {
            display: table;
            width: 100%;
            background-color: #e8e8e8;
            border-top: 2px solid #ffffff;
            font-size: 15px;
            font-weight: 800;
        }

        .event-item:nth-child(even) {
            background-color: #dddddd;
        }

        .event-indicator {
            display: table-cell;
            vertical-align: middle;
            width: 45px;
            padding: 5px 5px;
            background-color: #aaaaaa;
            text-align: center;
            text-transform: uppercase;
        }

        .event-content {
            display: table-cell;
            vertical-align: middle;
            padding: 5px 15px;
        }


        /* --- Stavový řádek --- */
        .status {
            margin-top: 10px;
            font-size: 11px;
            color: #333333;
            text-align: right;
        }

    </style>
</head>
<body>

    <div class="top-section">
        <!-- Hodiny (2/3) - Přidán onclick event -->
        <div class="clock-panel" onclick="toggleTimeFormat()">
            <div class="clock-date" id="main-date">&nbsp;</div>
            <div class="clock-time-wrapper">
                <div class="clock-time" id="main-time">--:--</div>
                <div class="clock-am-pm">
                    <!-- Přidána ID pro snadnější úpravy přes JS -->
                    <div class="clock-24h-badge" id="format-badge">24h</div>
                    <div class="clock-ampm-text" id="ampm-text"></div>
                </div>
            </div>
        </div>

        <!-- Odjezdy MHD (1/3) -->
        <div class="departures-panel">
            <div id="dep-list"><div class="dep-empty">Načítám…</div></div>
        </div>
    </div>

    <div class="bottom-section" id="events-container">
        <div class="day-block">
            <div class="day-header">Načítám události…</div>
        </div>
    </div>

    <div class="status" id="status"></div>

    <!-- config.js definuje EVENTS_URL a EVENTS_TOKEN (viz config.example.js) -->
    <script src="config.js"></script>
    <script>
        // ES5 only - starý WebKit v Kindle prohlížeči nezná let/const/arrow/fetch.

        var DAY_NAMES = ['Neděle', 'Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota'];
        var MONTH_GENITIVE = ['ledna', 'února', 'března', 'dubna', 'května', 'června',
            'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];

        var DATA_REFRESH_MS = 10 * 60 * 1000;
        var STALE_AFTER_MS = 30 * 60 * 1000;
        var DEPARTURES_REFRESH_MS = 60 * 1000;
        var DEPARTURES_STALE_MS = 3 * 60 * 1000;
        var MAX_TITLE_LENGTH = 40; // delší názvy událostí se zkrátí na "…"

        // Stavové proměnné
        var is24HourFormat = true;
        var lastDataOk = 0;      // čas posledního úspěšného načtení událostí
        var lastDataLabel = '';  // "HH:MM" posledního úspěšného načtení
        var shownDateKey = '';   // pro překreslení data jen při změně dne

        function toggleTimeFormat() {
            is24HourFormat = !is24HourFormat;
            updateClock();
        }

        function pad2(n) {
            return n < 10 ? '0' + n : '' + n;
        }

        // Starý prohlížeč na Kindlu neaplikuje časové pásmo zařízení na
        // Date.getHours()/getMinutes() (vrací čas jako UTC). Proto čas
        // dopočítáváme z UTC hodnot + ruční offset pro Prahu (CET/CEST).
        function getPragueOffsetHours(utcDate) {
            var year = utcDate.getUTCFullYear();

            function lastSundayUtc(y, month) {
                // Poslední den daného měsíce, pak dolů na nejbližší neděli
                var d = new Date(Date.UTC(y, month + 1, 0));
                d.setUTCDate(d.getUTCDate() - d.getUTCDay());
                d.setUTCHours(1, 0, 0, 0);
                return d;
            }

            var dstStart = lastSundayUtc(year, 2);  // poslední neděle v březnu
            var dstEnd = lastSundayUtc(year, 9);    // poslední neděle v říjnu

            if (utcDate.getTime() >= dstStart.getTime() && utcDate.getTime() < dstEnd.getTime()) {
                return 2; // CEST (letní čas)
            }
            return 1; // CET (standardní čas)
        }

        // Aktuální pražský čas rozložený na pole (y, mo 1-12, d, h, mi, wd 0=ne)
        function getPragueNow() {
            var now = new Date();
            var shifted = new Date(now.getTime() + getPragueOffsetHours(now) * 3600000);
            return {
                y: shifted.getUTCFullYear(),
                mo: shifted.getUTCMonth() + 1,
                d: shifted.getUTCDate(),
                h: shifted.getUTCHours(),
                mi: shifted.getUTCMinutes(),
                wd: shifted.getUTCDay()
            };
        }

        function updateClock() {
            var p = getPragueNow();
            var hours = p.h;
            var minutes = pad2(p.mi);

            var badgeElement = document.getElementById('format-badge');
            var ampmTextElement = document.getElementById('ampm-text');

            if (is24HourFormat) {
                badgeElement.textContent = '24h';
                ampmTextElement.style.display = 'none';
                hours = pad2(hours);
            } else {
                badgeElement.textContent = '12h';
                ampmTextElement.style.display = 'block';
                ampmTextElement.textContent = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // '0' hodin by mělo být '12'
                hours = pad2(hours);
            }

            document.getElementById('main-time').textContent = hours + ':' + minutes;

            // Datum se překresluje jen při změně dne
            var key = p.y + '-' + p.mo + '-' + p.d;
            if (key !== shownDateKey) {
                shownDateKey = key;
                renderDate(p);
            }
            updateStatus();
        }

        function renderDate(p) {
            document.getElementById('main-date').textContent =
                DAY_NAMES[p.wd] + ', ' + p.d + '. ' + MONTH_GENITIVE[p.mo - 1] + ' ' + p.y;
        }

        // --- Události ---

        function el(tag, cls, text) {
            var node = document.createElement(tag);
            if (cls) { node.className = cls; }
            if (text !== undefined) { node.textContent = text; }
            return node;
        }

        function eventText(ev) {
            var prefix;
            if (ev.allDay || (!ev.start && !ev.end)) {
                prefix = 'celý den';
            } else if (ev.start && ev.end) {
                prefix = ev.start + ' - ' + ev.end;
            } else if (ev.start) {
                prefix = ev.start;
            } else {
                prefix = 'do ' + ev.end;
            }
            var title = ev.title;
            if (title.length > MAX_TITLE_LENGTH) {
                title = title.substring(0, MAX_TITLE_LENGTH - 1) + '…';
            }
            return prefix + ': ' + title;
        }

        // Volá se z JSONP odpovědi serveru: renderEvents({now, days, errors})
        function renderEvents(data) {
            var container = document.getElementById('events-container');
            container.innerHTML = '';

            for (var i = 0; i < data.days.length; i++) {
                var day = data.days[i];
                var block = el('div', 'day-block');
                block.appendChild(el('div', 'day-header', day.label));

                var list = el('div', 'event-list');
                if (day.events.length === 0) {
                    var emptyRow = el('div', 'event-item');
                    emptyRow.appendChild(el('div', 'event-indicator', '-'));
                    emptyRow.appendChild(el('div', 'event-content', 'Žádné události'));
                    list.appendChild(emptyRow);
                }
                for (var j = 0; j < day.events.length; j++) {
                    var ev = day.events[j];
                    var row = el('div', 'event-item');
                    row.appendChild(el('div', 'event-indicator', ev.src));
                    row.appendChild(el('div', 'event-content', eventText(ev)));
                    list.appendChild(row);
                }
                block.appendChild(list);
                container.appendChild(block);
            }

            var p = getPragueNow();
            lastDataOk = new Date().getTime();
            lastDataLabel = pad2(p.h) + ':' + pad2(p.mi);
            var errs = data.errors && data.errors.length ? ' | chyba: ' + data.errors.join(', ') : '';
            setStatus('Aktualizováno ' + lastDataLabel + errs);
            fitToScreen();
        }

        // Prohlížeč na Kindlu má vlastní lištu, která zmenšuje viditelnou plochu.
        // Dny, které se nevejdou, se skryjí (od konce); první den zůstane vždy.
        function fitToScreen() {
            var container = document.getElementById('events-container');
            var status = document.getElementById('status');
            var available = window.innerHeight || document.documentElement.clientHeight;
            var blocks = container.children;
            var i;

            for (i = 0; i < blocks.length; i++) {
                blocks[i].style.display = '';
            }
            if (!available) { return; }

            // spodní okraj stavového řádku + padding body (15px)
            function bottom() {
                return status.offsetTop + status.offsetHeight + 15;
            }
            for (i = blocks.length - 1; i > 0 && bottom() > available; i--) {
                blocks[i].style.display = 'none';
            }
        }

        // Patička má dvě části: stav událostí a stav odjezdů (ta se ukáže jen při potížích)
        var statusMain = '';
        var statusDep = '';

        function showStatus() {
            document.getElementById('status').textContent = statusMain + (statusDep ? ' | ' + statusDep : '');
        }

        function setStatus(text) {
            statusMain = text;
            showStatus();
        }

        function setDepStatus(text) {
            statusDep = text;
            showStatus();
        }

        function updateStatus() {
            // Bez úspěšného načtení delší dobu -> upozornit, že data jsou zastaralá
            if (lastDataOk && new Date().getTime() - lastDataOk > STALE_AFTER_MS) {
                setStatus('OFFLINE - data z ' + lastDataLabel);
            }
            updateDeparturesStatus();
        }

        // --- JSONP načítání (script tag; XHR/CORS na starém Kindle WebKitu nespolehlivé) ---

        var jsonpScripts = {};

        function loadJsonp(key, url, onError) {
            var old = jsonpScripts[key];
            if (old && old.parentNode) {
                old.parentNode.removeChild(old);
            }
            var node = document.createElement('script');
            node.onerror = onError;
            node.src = url;
            jsonpScripts[key] = node;
            document.getElementsByTagName('head')[0].appendChild(node);
        }

        function loadEvents() {
            if (typeof EVENTS_URL === 'undefined' || typeof EVENTS_TOKEN === 'undefined') {
                setStatus('Chybí config.js (EVENTS_URL, EVENTS_TOKEN)');
                return;
            }
            loadJsonp('events', EVENTS_URL + '?token=' + encodeURIComponent(EVENTS_TOKEN) +
                '&cb=renderEvents&t=' + new Date().getTime(), function () {
                if (!lastDataOk) { setStatus('OFFLINE - události se nepodařilo načíst'); }
                updateStatus();
            });
        }

        // --- Odjezdy MHD ---

        // Výchozí filtr, přepsatelný v config.js (DEPARTURE_FILTER). Jeden záznam = jeden
        // řádek tabulky. line je povinná; volitelně direction (1/2, stabilní směr podle
        // Wiener Linien) a towards (část názvu cílové stanice, bez ohledu na velikost písmen).
        var DEFAULT_DEPARTURE_FILTER = [
            { line: '18', direction: 1 },
            { line: '18', direction: 2 },
            { line: '71', direction: 2 },
            { line: '74A', towards: 'Stubentor' }
        ];

        var lastDepOk = 0;
        var lastDepLabel = '';

        function departureFilter() {
            return typeof DEPARTURE_FILTER !== 'undefined' ? DEPARTURE_FILTER : DEFAULT_DEPARTURE_FILTER;
        }

        // Odjezdy dříve než za N minut se nezobrazí (nestihnu dojít); výchozí 0
        function departureMinMinutes() {
            return typeof DEPARTURE_MIN_MINUTES === 'number' ? DEPARTURE_MIN_MINUTES : 0;
        }

        function departuresUrl() {
            if (typeof DEPARTURES_URL !== 'undefined') { return DEPARTURES_URL; }
            return EVENTS_URL.replace(/events\.js$/, 'departures.js');
        }

        function matchesDeparture(entry, f) {
            if (String(entry.line).toLowerCase() !== String(f.line).toLowerCase()) { return false; }
            if (f.direction && Number(f.direction) !== entry.dir) { return false; }
            if (f.towards && entry.towards.toLowerCase().indexOf(String(f.towards).toLowerCase()) === -1) {
                return false;
            }
            return true;
        }

        function shortTowards(text) {
            var t = text.split(',')[0];
            return t.length > 18 ? t.substring(0, 17) + '…' : t;
        }

        // Volá se z JSONP odpovědi serveru: renderDepartures({generated, lines})
        function renderDepartures(data) {
            var list = document.getElementById('dep-list');
            var filter = departureFilter();
            var minMin = departureMinMinutes();
            list.innerHTML = '';

            for (var i = 0; i < filter.length; i++) {
                var mins = [];
                var nextMin = 1e9;
                var towards = '';
                for (var j = 0; j < data.lines.length; j++) {
                    var entry = data.lines[j];
                    if (!matchesDeparture(entry, filter[i])) { continue; }
                    for (var k = 0; k < entry.mins.length; k++) {
                        if (entry.mins[k] < minMin) { continue; }
                        mins.push(entry.mins[k]);
                        if (entry.mins[k] < nextMin) {
                            nextMin = entry.mins[k];
                            towards = entry.towards; // cíl nejbližšího spoje (71 má zkrácené jízdy)
                        }
                    }
                }
                mins.sort(function (a, b) { return a - b; });

                var shown = [];
                for (var m = 0; m < mins.length && m < 3; m++) {
                    shown.push(mins[m] === 0 ? 'teď' : '' + mins[m]);
                }

                var row = el('div', 'dep-row');
                row.appendChild(el('div', 'dep-line', filter[i].line));
                var info = el('div', 'dep-info');
                info.appendChild(el('div', 'dep-towards', towards ? shortTowards(towards) : '\u00a0'));
                info.appendChild(el('div', 'dep-times', shown.length ? shown.join(' · ') : '–'));
                row.appendChild(info);
                list.appendChild(row);
            }

            var p = getPragueNow();
            lastDepOk = new Date().getTime();
            lastDepLabel = pad2(p.h) + ':' + pad2(p.mi);
            setDepStatus('');
        }

        function loadDepartures() {
            if (typeof EVENTS_URL === 'undefined' || typeof EVENTS_TOKEN === 'undefined') { return; }
            loadJsonp('departures', departuresUrl() + '?token=' + encodeURIComponent(EVENTS_TOKEN) +
                '&cb=renderDepartures&t=' + new Date().getTime(), function () {
                if (!lastDepOk) {
                    setDepStatus('odjezdy OFFLINE');
                }
                updateDeparturesStatus();
            });
        }

        // Starší než pár minut -> čísla by lhala, tak to řekneme nahlas (v patičce)
        function updateDeparturesStatus() {
            if (lastDepOk && new Date().getTime() - lastDepOk > DEPARTURES_STALE_MS) {
                setDepStatus('odjezdy OFFLINE - data z ' + lastDepLabel);
            }
        }

        // Start
        updateClock();
        loadEvents();
        loadDepartures();

        // Hodiny se překreslují jen jednou za minutu (méně překreslení e-inku):
        // krátkým intervalem hlídáme změnu minuty a překreslíme až při ní.
        var lastMinute = -1;
        setInterval(function () {
            var m = new Date().getUTCMinutes();
            if (m !== lastMinute) {
                lastMinute = m;
                updateClock();
            }
        }, 5000);

        // Data z kalendářů každých 10 minut, bez blikání celé stránky
        setInterval(loadEvents, DATA_REFRESH_MS);

        // Odjezdy MHD každou minutu (jen malá tabulka, ne celá stránka)
        setInterval(loadDepartures, DEPARTURES_REFRESH_MS);

        // Celá stránka jednou denně kolem 3:00 (úklid paměti prohlížeče).
        // Podmínka na "stáří stránky" brání opakovanému reloadu v okně 3:00-3:59.
        var pageLoadedAt = new Date().getTime();
        setInterval(function () {
            var uptime = new Date().getTime() - pageLoadedAt;
            if (getPragueNow().h === 3 && uptime > 20 * 3600 * 1000) {
                location.reload();
            }
        }, 60 * 1000);
    </script>
</body>
</html>
