<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kindle E-ink Kalendář</title>
    <style>
        /* Poznámka: staré WebKit v Kindle prohlížeči nepodporuje CSS proměnné,
           flexbox, grid ani vh/vw jednotky. Layout je proto postaven na
           float / display:table-cell a barvy jsou napsané natvrdo jako hex. */

        * {
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            /* Ideální šířka a orientace pro Kindle (600x800) */
            width: 100%;
            max-width: 590px;
            margin: 0 auto;
            padding: 15px;
        }

        /* --- HORNÍ SEKCE --- */
        .top-section {
            width: 100%;
            height: 210px;
            margin-bottom: 15px;
        }

        .top-section:after {
            content: "";
            display: table;
            clear: both;
        }

        /* Levý panel: Hodiny (2/3) */
        .clock-panel {
            float: left;
            width: 360px;
            height: 210px;
            margin-right: 15px;
            background-color: #000000;
            color: #ffffff;
            -webkit-border-radius: 6px;
            border-radius: 6px;
            padding: 20px;
            cursor: pointer; /* Změna kurzoru pro indikaci klikatelnosti */
        }

        .clock-date {
            color: #cccccc;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .clock-time-wrapper {
            margin-top: 15px;
        }

        .clock-time {
            font-size: 5em;
            font-weight: 800;
            line-height: 1;
        }

        .clock-am-pm {
            margin-top: 10px;
            height: 30px;
        }

        .clock-am-pm:after {
            content: "";
            display: table;
            clear: both;
        }

        .clock-24h-badge {
            float: left;
            background-color: #666666;
            color: #e8e8e8;
            font-size: 12px;
            padding: 2px 6px;
            -webkit-border-radius: 4px;
            border-radius: 4px;
        }

        .clock-ampm-text {
            float: right;
            font-size: 24px;
            font-weight: bold;
        }

        /* Pravý panel: Měsíční kalendář (1/3) */
        .calendar-panel {
            float: left;
            width: 185px;
            height: 210px;
            background-color: #f4f4f4;
            border: 2px solid #cccccc;
            -webkit-border-radius: 6px;
            border-radius: 6px;
            padding: 10px 15px;
        }

        .calendar-header {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .calendar-header:after {
            content: "";
            display: table;
            clear: both;
        }

        .calendar-header span {
            display: block;
            text-align: center;
        }

        .calendar-grid {
            text-align: center;
            font-size: 12px;
        }

        .calendar-grid:after {
            content: "";
            display: table;
            clear: both;
        }

        .calendar-grid .day-name,
        .calendar-grid .day {
            float: left;
            width: 14.28%;
        }

        /* Vynucení zlomu řádku po každém 7. prvku - zaokrouhlování šířky
           14.28% by jinak mohlo nechat float "vklouznout" do mezery na
           konci předchozího řádku místo na začátek nového. */
        .calendar-grid > :nth-child(7n+1) {
            clear: left;
        }

        .calendar-grid .day-name {
            font-weight: bold;
            color: #555555;
            margin-bottom: 5px;
        }

        .calendar-grid .day {
            padding: 2px 0;
            margin: 2px 0;
            color: #000000;
        }

        .calendar-grid .day.empty {
            color: transparent;
        }

        .calendar-grid .day.active {
            background-color: #000000;
            color: #ffffff;
            font-weight: bold;
            -webkit-border-radius: 3px;
            border-radius: 3px;
        }

        /* --- SPODNÍ SEKCE: Události --- */
        .day-block {
            border: 2px solid #cccccc;
            -webkit-border-radius: 6px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .day-block:last-child {
            margin-bottom: 0;
        }

        .day-header {
            background-color: #666666;
            color: #ffffff;
            font-weight: bold;
            padding: 8px 12px;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Řádek události: table/table-cell místo flexu, aby indikátor
           a text byly stejně vysoké (float toho spolehlivě nedosáhne) */
        .event-item {
            display: table;
            width: 100%;
            background-color: #e8e8e8;
            border-top: 2px solid #ffffff;
            font-size: 15px;
            font-weight: 800;
        }

        .event-item:nth-child(even) {
            background-color: #dddddd;
        }

        .event-indicator {
            display: table-cell;
            vertical-align: middle;
            width: 45px;
            padding: 5px 5px;
            background-color: #aaaaaa;
            text-align: center;
            text-transform: uppercase;
        }

        .event-content {
            display: table-cell;
            vertical-align: middle;
            padding: 5px 15px;
        }


        /* --- Stavový řádek --- */
        .status {
            margin-top: 10px;
            font-size: 11px;
            color: #666666;
            text-align: right;
        }

    </style>
</head>
<body>

    <div class="top-section">
        <!-- Hodiny (2/3) - Přidán onclick event -->
        <div class="clock-panel" onclick="toggleTimeFormat()">
            <div class="clock-date" id="main-date">&nbsp;</div>
            <div class="clock-time-wrapper">
                <div class="clock-time" id="main-time">--:--</div>
                <div class="clock-am-pm">
                    <!-- Přidána ID pro snadnější úpravy přes JS -->
                    <div class="clock-24h-badge" id="format-badge">24h</div>
                    <div class="clock-ampm-text" id="ampm-text"></div>
                </div>
            </div>
        </div>

        <!-- Mini Kalendář (1/3) -->
        <div class="calendar-panel">
            <div class="calendar-header">
                <span id="calendar-title">&nbsp;</span>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>
    </div>

    <div class="bottom-section" id="events-container">
        <div class="day-block">
            <div class="day-header">Načítám události…</div>
        </div>
    </div>

    <div class="status" id="status"></div>

    <!-- config.js definuje EVENTS_URL a EVENTS_TOKEN (viz config.example.js) -->
    <script src="config.js"></script>
    <script>
        // ES5 only - starý WebKit v Kindle prohlížeči nezná let/const/arrow/fetch.

        var DAY_NAMES = ['Neděle', 'Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota'];
        var MONTH_NAMES = ['Leden', 'Únor', 'Březen', 'Duben', 'Květen', 'Červen',
            'Červenec', 'Srpen', 'Září', 'Říjen', 'Listopad', 'Prosinec'];
        var MONTH_GENITIVE = ['ledna', 'února', 'března', 'dubna', 'května', 'června',
            'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];

        var DATA_REFRESH_MS = 10 * 60 * 1000;
        var STALE_AFTER_MS = 30 * 60 * 1000;
        var MAX_TITLE_LENGTH = 40; // delší názvy událostí se zkrátí na "…"

        // Stavové proměnné
        var is24HourFormat = true;
        var lastDataOk = 0;      // čas posledního úspěšného načtení událostí
        var lastDataLabel = '';  // "HH:MM" posledního úspěšného načtení
        var shownDateKey = '';   // pro překreslení mřížky jen při změně dne

        function toggleTimeFormat() {
            is24HourFormat = !is24HourFormat;
            updateClock();
        }

        function pad2(n) {
            return n < 10 ? '0' + n : '' + n;
        }

        // Starý prohlížeč na Kindlu neaplikuje časové pásmo zařízení na
        // Date.getHours()/getMinutes() (vrací čas jako UTC). Proto čas
        // dopočítáváme z UTC hodnot + ruční offset pro Prahu (CET/CEST).
        function getPragueOffsetHours(utcDate) {
            var year = utcDate.getUTCFullYear();

            function lastSundayUtc(y, month) {
                // Poslední den daného měsíce, pak dolů na nejbližší neděli
                var d = new Date(Date.UTC(y, month + 1, 0));
                d.setUTCDate(d.getUTCDate() - d.getUTCDay());
                d.setUTCHours(1, 0, 0, 0);
                return d;
            }

            var dstStart = lastSundayUtc(year, 2);  // poslední neděle v březnu
            var dstEnd = lastSundayUtc(year, 9);    // poslední neděle v říjnu

            if (utcDate.getTime() >= dstStart.getTime() && utcDate.getTime() < dstEnd.getTime()) {
                return 2; // CEST (letní čas)
            }
            return 1; // CET (standardní čas)
        }

        // Aktuální pražský čas rozložený na pole (y, mo 1-12, d, h, mi, wd 0=ne)
        function getPragueNow() {
            var now = new Date();
            var shifted = new Date(now.getTime() + getPragueOffsetHours(now) * 3600000);
            return {
                y: shifted.getUTCFullYear(),
                mo: shifted.getUTCMonth() + 1,
                d: shifted.getUTCDate(),
                h: shifted.getUTCHours(),
                mi: shifted.getUTCMinutes(),
                wd: shifted.getUTCDay()
            };
        }

        function updateClock() {
            var p = getPragueNow();
            var hours = p.h;
            var minutes = pad2(p.mi);

            var badgeElement = document.getElementById('format-badge');
            var ampmTextElement = document.getElementById('ampm-text');

            if (is24HourFormat) {
                badgeElement.textContent = '24h';
                ampmTextElement.style.display = 'none';
                hours = pad2(hours);
            } else {
                badgeElement.textContent = '12h';
                ampmTextElement.style.display = 'block';
                ampmTextElement.textContent = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // '0' hodin by mělo být '12'
                hours = pad2(hours);
            }

            document.getElementById('main-time').textContent = hours + ':' + minutes;

            // Datum a mřížka se překreslují jen při změně dne
            var key = p.y + '-' + p.mo + '-' + p.d;
            if (key !== shownDateKey) {
                shownDateKey = key;
                renderDate(p);
                renderMonth(p);
            }
            updateStatus();
        }

        function renderDate(p) {
            document.getElementById('main-date').textContent =
                DAY_NAMES[p.wd] + ', ' + p.d + '. ' + MONTH_GENITIVE[p.mo - 1] + ' ' + p.y;
        }

        // Měsíční mřížka (pondělí první). Buňky jsou přímé potomky
        // .calendar-grid, aby fungovalo nth-child(7n+1) z CSS.
        function renderMonth(p) {
            document.getElementById('calendar-title').textContent = MONTH_NAMES[p.mo - 1] + ' ' + p.y;

            var grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            function cell(cls, text) {
                var div = document.createElement('div');
                div.className = cls;
                div.textContent = text;
                grid.appendChild(div);
            }

            var names = ['Po', 'Út', 'St', 'Čt', 'Pá', 'So', 'Ne'];
            for (var i = 0; i < 7; i++) {
                cell('day-name', names[i]);
            }

            var firstWeekday = (new Date(Date.UTC(p.y, p.mo - 1, 1)).getUTCDay() + 6) % 7;
            var daysInMonth = new Date(Date.UTC(p.y, p.mo, 0)).getUTCDate();

            for (var e = 0; e < firstWeekday; e++) {
                cell('day empty', '0'); // průhledná nula drží výšku řádku
            }
            for (var d = 1; d <= daysInMonth; d++) {
                cell(d === p.d ? 'day active' : 'day', '' + d);
            }
        }

        // --- Události ---

        function el(tag, cls, text) {
            var node = document.createElement(tag);
            if (cls) { node.className = cls; }
            if (text !== undefined) { node.textContent = text; }
            return node;
        }

        function eventText(ev) {
            var prefix;
            if (ev.allDay || (!ev.start && !ev.end)) {
                prefix = 'celý den';
            } else if (ev.start && ev.end) {
                prefix = ev.start + ' - ' + ev.end;
            } else if (ev.start) {
                prefix = ev.start;
            } else {
                prefix = 'do ' + ev.end;
            }
            var title = ev.title;
            if (title.length > MAX_TITLE_LENGTH) {
                title = title.substring(0, MAX_TITLE_LENGTH - 1) + '…';
            }
            return prefix + ': ' + title;
        }

        // Volá se z JSONP odpovědi serveru: renderEvents({now, days, errors})
        function renderEvents(data) {
            var container = document.getElementById('events-container');
            container.innerHTML = '';

            for (var i = 0; i < data.days.length; i++) {
                var day = data.days[i];
                var block = el('div', 'day-block');
                block.appendChild(el('div', 'day-header', day.label));

                var list = el('div', 'event-list');
                if (day.events.length === 0) {
                    var emptyRow = el('div', 'event-item');
                    emptyRow.appendChild(el('div', 'event-indicator', '-'));
                    emptyRow.appendChild(el('div', 'event-content', 'Žádné události'));
                    list.appendChild(emptyRow);
                }
                for (var j = 0; j < day.events.length; j++) {
                    var ev = day.events[j];
                    var row = el('div', 'event-item');
                    row.appendChild(el('div', 'event-indicator', ev.src));
                    row.appendChild(el('div', 'event-content', eventText(ev)));
                    list.appendChild(row);
                }
                block.appendChild(list);
                container.appendChild(block);
            }

            var p = getPragueNow();
            lastDataOk = new Date().getTime();
            lastDataLabel = pad2(p.h) + ':' + pad2(p.mi);
            var errs = data.errors && data.errors.length ? ' | chyba: ' + data.errors.join(', ') : '';
            setStatus('Aktualizováno ' + lastDataLabel + errs);
            fitToScreen();
        }

        // Prohlížeč na Kindlu má vlastní lištu, která zmenšuje viditelnou plochu.
        // Dny, které se nevejdou, se skryjí (od konce); první den zůstane vždy.
        function fitToScreen() {
            var container = document.getElementById('events-container');
            var status = document.getElementById('status');
            var available = window.innerHeight || document.documentElement.clientHeight;
            var blocks = container.children;
            var i;

            for (i = 0; i < blocks.length; i++) {
                blocks[i].style.display = '';
            }
            if (!available) { return; }

            // spodní okraj stavového řádku + padding body (15px)
            function bottom() {
                return status.offsetTop + status.offsetHeight + 15;
            }
            for (i = blocks.length - 1; i > 0 && bottom() > available; i--) {
                blocks[i].style.display = 'none';
            }
        }

        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function updateStatus() {
            // Bez úspěšného načtení delší dobu -> upozornit, že data jsou zastaralá
            if (lastDataOk && new Date().getTime() - lastDataOk > STALE_AFTER_MS) {
                setStatus('OFFLINE - data z ' + lastDataLabel);
            }
        }

        var dataScript = null;

        function loadEvents() {
            if (typeof EVENTS_URL === 'undefined' || typeof EVENTS_TOKEN === 'undefined') {
                setStatus('Chybí config.js (EVENTS_URL, EVENTS_TOKEN)');
                return;
            }
            if (dataScript && dataScript.parentNode) {
                dataScript.parentNode.removeChild(dataScript);
            }
            dataScript = document.createElement('script');
            dataScript.onerror = function () {
                if (!lastDataOk) { setStatus('OFFLINE - události se nepodařilo načíst'); }
                updateStatus();
            };
            dataScript.src = EVENTS_URL + '?token=' + encodeURIComponent(EVENTS_TOKEN) +
                '&cb=renderEvents&t=' + new Date().getTime();
            document.getElementsByTagName('head')[0].appendChild(dataScript);
        }

        // Start
        updateClock();
        loadEvents();

        // Hodiny se překreslují jen jednou za minutu (méně překreslení e-inku):
        // krátkým intervalem hlídáme změnu minuty a překreslíme až při ní.
        var lastMinute = -1;
        setInterval(function () {
            var m = new Date().getUTCMinutes();
            if (m !== lastMinute) {
                lastMinute = m;
                updateClock();
            }
        }, 5000);

        // Data z kalendářů každých 10 minut, bez blikání celé stránky
        setInterval(loadEvents, DATA_REFRESH_MS);

        // Celá stránka jednou denně kolem 3:00 (úklid paměti prohlížeče).
        // Podmínka na "stáří stránky" brání opakovanému reloadu v okně 3:00-3:59.
        var pageLoadedAt = new Date().getTime();
        setInterval(function () {
            var uptime = new Date().getTime() - pageLoadedAt;
            if (getPragueNow().h === 3 && uptime > 20 * 3600 * 1000) {
                location.reload();
            }
        }, 60 * 1000);
    </script>
</body>
</html>
